sonar.projectKey=mateusz-klatt_rdsclock
sonar.organization=mateusz-klatt

# Layout
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Coverage produced by the test workflow (coverage.xml).
sonar.python.coverage.reportPaths=coverage.xml

# Quality-of-life: exclude generated and binary artefacts from the analysis.
sonar.exclusions=**/__pycache__/**,**/*.iq,**/*.wav,**/*.png,docs/images/**,build/**,scripts/night/**,eter/**

# Test files are reported but not analysed as production code.
sonar.test.exclusions=**/__pycache__/**

# Source character set.
sonar.sourceEncoding=UTF-8
