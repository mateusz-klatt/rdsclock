sonar.projectKey=mateusz-klatt_rdsclock
sonar.organization=mateusz-klatt

# Layout
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**
sonar.python.version=3.12

# Coverage produced by the test workflow (coverage.xml).
sonar.python.coverage.reportPaths=coverage.xml
# The browser page only renders the snapshots that web.py builds and the
# Python tests cover; it is checked in a browser rather than unit-tested.
# Its code is still analysed, only left out of the coverage figures.
sonar.coverage.exclusions=src/rdsclock/webui/**

# Quality-of-life: exclude generated and binary artefacts from the analysis.
sonar.exclusions=**/__pycache__/**,**/*.iq,**/*.wav,**/*.png,docs/images/**,build/**,scripts/night/**,eter/**

# Test files are reported but not analysed as production code.
sonar.test.exclusions=**/__pycache__/**

# Source character set.
sonar.sourceEncoding=UTF-8
