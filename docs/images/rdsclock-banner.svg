<svg xmlns="http://www.w3.org/2000/svg" width="960" height="192" viewBox="0 0 960 192" role="img" aria-labelledby="title description">
  <title id="title">rdsclock — radio clock</title>
  <desc id="description">An original clock dial with a north marker and radio-wave arcs, beside the rdsclock wordmark on a navy background.</desc>

  <rect width="960" height="192" rx="12" fill="#0b2036"/>
  <path d="M28 191H932" stroke="#365773" stroke-width="2"/>

  <!-- Clock dial: a north marker, twelve ticks and two clock hands. -->
  <g transform="translate(94 101)">
    <circle r="51" fill="none" stroke="#f0f6fb" stroke-width="2.5"/>
    <g stroke="#aec6d9" stroke-width="2" stroke-linecap="round">
      <path d="M0-43V-36 M0 36V43 M-43 0H-36 M36 0H43"/>
      <path d="M21.5-37.2L19-32.9 M37.2-21.5L32.9-19 M37.2 21.5L32.9 19 M21.5 37.2L19 32.9 M-21.5 37.2L-19 32.9 M-37.2 21.5L-32.9 19 M-37.2-21.5L-32.9-19 M-21.5-37.2L-19-32.9"/>
    </g>
    <path d="M-5-61L0-70L5-61Z" fill="#82d6df"/>
    <path d="M0 0L-21-18" fill="none" stroke="#f0f6fb" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 0L28-24" fill="none" stroke="#82d6df" stroke-width="3.5" stroke-linecap="round"/>
    <circle r="4.5" fill="#f0f6fb"/>
    <g fill="none" stroke="#82d6df" stroke-width="2" stroke-linecap="round">
      <path d="M58-28A64.4 64.4 0 0 1 58 28"/>
      <path d="M68-35A76.5 76.5 0 0 1 68 35" opacity="0.55"/>
    </g>
  </g>

  <text x="202" y="112" fill="#f0f6fb" font-family="DejaVu Sans, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">rdsclock</text>
  <text x="205" y="143" fill="#b6ccdc" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" letter-spacing="2">FM · RDS · CLOCK-TIME</text>

  <!-- Abstract received waveform; decorative, not measurement data. -->
  <g transform="translate(670 99)" fill="none" stroke-linecap="round">
    <path d="M0 0H236" stroke="#365773" stroke-width="1"/>
    <path d="M28-48V48 M88-48V48 M148-48V48 M208-48V48" stroke="#25445e" stroke-width="1"/>
    <path d="M0 0C8 0 8-8 16-8S24 8 32 8S40-16 48-16S56 16 64 16S72-28 80-28S88 28 96 28S104-43 112-43S120 43 128 43S136-28 144-28S152 28 160 28S168-16 176-16S184 16 192 16S200-8 208-8S216 8 224 8S232 0 236 0" stroke="#82d6df" stroke-width="2.5"/>
  </g>
</svg>
