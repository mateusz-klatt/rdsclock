[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdsclock"
version = "0.2.0"
description = "Passive RDS Clock-Time receiver for FM via RTL-SDR, with multi-source consensus for GPS-denied environments"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Mateusz Klatt", email = "mateusz@klatt.ie" },
]
keywords = ["sdr", "rds", "fm", "time-sync", "passive-rf", "rtl-sdr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
audio = [
    "sounddevice>=0.4.6",
]
plot = [
    "matplotlib>=3.7.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-timeout>=2.1.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "black>=24.0",
]

[project.scripts]
rdsclock = "rdsclock.cli:main"

[project.urls]
Homepage = "https://github.com/mateusz-klatt/rdsclock"
Documentation = "https://github.com/mateusz-klatt/rdsclock/tree/master/docs"
Issues = "https://github.com/mateusz-klatt/rdsclock/issues"
Changelog = "https://github.com/mateusz-klatt/rdsclock/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rdsclock = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --disable-warnings"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: integration tests",
    "real_sdr: requires real SDR recordings or running rtl_tcp",
]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
