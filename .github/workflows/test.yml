name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.2"
          enable-cache: true

      - name: Install package and test dependencies
        run: |
          uv sync --frozen --extra audio --extra plot --extra dev --no-install-project --no-build

      - name: Compile-only sanity check
        run: |
          uv run --no-sync --no-build python -m compileall -q src/rdsclock tests tools

      - name: Run fast tests
        run: |
          uv run --no-sync --no-build python -m pytest tests/ -m "not slow and not real_sdr" -q -W error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Install locked lint dependencies
        run: uv sync --frozen --extra dev --no-install-project --no-build
      - name: ruff check
        run: uv run --no-sync --no-build ruff check src/ tests/
